name: Retry failed PR jobs

# Re-runs failed jobs of PR-triggered runs once (run_attempt == 1) to absorb
# flaky failures. run_attempt 1 also stops the loop: if the rerun fails again,
# the workflow does not rerun again.
on:
  workflow_run:

permissions:
  actions: write

jobs:
  retry:
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X POST repos/rodrigoedu94-png/hindsight/actions/runs/${{ github.event.workflow_run.id }}/rerun-failed-jobs
        env:
          GH_TOKEN: ${{ github.token }}
